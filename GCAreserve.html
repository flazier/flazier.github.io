<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>實驗室設備預約系統</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; }
    select, input { padding: 8px; width: 100%; max-width: 300px; }
    button { padding: 10px 20px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>實驗室設備預約</h2>

  <form id="reserveForm">
    <div class="form-group">
      <label for="applicant">申請人姓名：</label>
      <input type="text" id="applicant" required>
    </div>

    <div class="form-group">
      <label for="equipment">預約設備：</label>
      <select id="equipment" required>
        <option value="">資料載入中...</option>
      </select>
    </div>

    <div class="form-group">
      <label for="reserveDate">預約日期：</label>
      <input type="date" id="reserveDate" required>
    </div>

    <div class="form-group">
      <label for="timeSlot">預約時段：</label>
      <select id="timeSlot" required>
        <option value="">請先選擇日期</option>
      </select>
    </div>

    <button type="submit">送出預約</button>
  </form>

  <script>
    // 替換為你最新的 API 網址
    const API_URL = 'https://script.google.com/macros/s/AKfycbz5xct111F7JZJCnRFejZ03O92HuuqSOSH8fSpHg5CaAYaTpI7icAF6wQyK4f3ZNOf88g/exec';
    
    let timeSlotData = [];
    const dayMap = {0: "星期日", 1: "星期一", 2: "星期二", 3: "星期三", 4: "星期四", 5: "星期五", 6: "星期六"};

    // 網頁載入時，自動向 GAS 請求資料
    window.onload = function() {
      // 1. 取得設備清單
      fetch(API_URL + '?action=getEquipment')
        .then(response => response.json())
        .then(data => {
          const eqSelect = document.getElementById("equipment");
          eqSelect.innerHTML = '<option value="">請選擇設備</option>';
          data.forEach(item => {
            const option = document.createElement("option");
            option.value = item.id || item.displayText; 
            option.textContent = item.displayText;
            eqSelect.appendChild(option);
          });
        })
        .catch(error => console.error('設備載入錯誤:', error));

      // 2. 取得時段許可資料
      fetch(API_URL + '?action=getTimeSlots')
        .then(response => response.json())
        .then(data => {
          timeSlotData = data;
        })
        .catch(error => console.error('時段載入錯誤:', error));
    };

    // 3. 監聽日期變更，動態更新時段選單
    document.getElementById("reserveDate").addEventListener("change", function(event) {
      const selectedDate = new Date(event.target.value);
      const dayString = dayMap[selectedDate.getDay()]; 
      const timeSelect = document.getElementById("timeSlot");
      
      timeSelect.innerHTML = '<option value="">請選擇時段...</option>';

      if (timeSlotData.length === 0) {
        timeSelect.innerHTML = '<option value="">資料載入中，請稍候再試</option>';
        return;
      }

      // 直接比對 slot.day 與 slot.status
      const availableSlots = timeSlotData.filter(slot => 
        slot.day === dayString && slot.status === "可借用"
      );

      if (availableSlots.length === 0) {
        timeSelect.innerHTML = '<option value="">當日無可借用時段</option>';
      } else {
        availableSlots.forEach(slot => {
          const option = document.createElement("option");
          option.value = slot.time;
          option.textContent = slot.time;
          timeSelect.appendChild(option);
        });
      }
    });

    // 4. 攔截表單送出 (目前僅測試前端邏輯，後續再實作 POST 寫入)
    document.getElementById("reserveForm").addEventListener("submit", function(e) {
      e.preventDefault();
      alert("前端資料讀取與篩選測試成功！後續步驟將實作 POST 將資料寫入預約總表。");
    });
  </script>

</body>
</html>
