<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圖文系設備預約系統</title>
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --bg-gray: #f8fafc;
      --border: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 30px 20px; background-color: #f1f5f9; color: var(--text-main); max-width: 1080px; margin: 0 auto; line-height: 1.6; }
    h2 { text-align: center; color: #0f172a; margin-bottom: 30px; font-weight: 600; letter-spacing: 1px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--text-main); padding-bottom: 10px; }
    
    #globalLoading { text-align: center; font-size: 18px; color: var(--primary); font-weight: 500; padding: 60px 20px; letter-spacing: 1px; }
    .app-container { display: none; }

    .tabs { display: flex; gap: 5px; margin-bottom: 25px; border-bottom: 1px solid var(--border); }
    .tab-btn { background: transparent; border: none; padding: 12px 24px; font-size: 15px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; border-radius: 0; }
    .tab-btn:hover { color: var(--primary); background: #e2e8f0; }
    .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
    .tab-content { display: none; background: white; padding: 30px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-radius: 2px; }
    .tab-content.active { display: block; }

    input, select { padding: 12px; width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 2px; font-size: 15px; margin-bottom: 15px; transition: border-color 0.2s; }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    
    button { padding: 10px 16px; font-weight: 600; border: none; border-radius: 2px; cursor: pointer; transition: 0.2s; white-space: nowrap; font-size: 14px; letter-spacing: 0.5px; }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    .btn-primary { background-color: var(--primary); color: white; width: 100%; }
    .btn-primary:hover { background-color: #1d4ed8; }
    .btn-success { background-color: var(--success); color: white; }
    .btn-danger { background-color: var(--danger); color: white; }
    
    .table-container { overflow-x: auto; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; font-size: 14px; }
    th, td { border: 1px solid var(--border); padding: 15px 10px; text-align: center; }
    th { background-color: var(--bg-gray); font-weight: 600; color: var(--text-main); }
    .slot-available { background-color: #f0fdf4; color: #166534; cursor: pointer; font-weight: 600; transition: background-color 0.2s; }
    .slot-available:hover { background-color: #dcfce7; }
    .slot-booked { background-color: #fef2f2; color: #991b1b; }
    .slot-closed { background-color: #f8fafc; color: var(--text-muted); }
    .slot-reason { font-size: 12px; display: block; margin-top: 6px; color: #94a3b8; }

    .digital-pass { background: #fff; border: 1px solid var(--border); border-left: 6px solid var(--success); padding: 20px; border-radius: 2px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .digital-pass h4 { margin: 0 0 8px 0; color: var(--text-main); font-size: 16px; }
    
    .admin-panel { border: 1px solid var(--border); border-radius: 2px; padding: 25px; margin-bottom: 25px; background: #fff; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 20px; margin: 15px 0 25px 0; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 15px; }
    .checkbox-label input { width: auto; margin: 0; }

    .points-box { background: var(--bg-gray); padding: 20px; border-radius: 2px; border: 1px solid var(--border); margin-bottom: 20px; }
    .points-row { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; }
    
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: white; padding: 30px; border-radius: 2px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    .modal-box h3 { margin-top: 0; font-weight: 600; }
    .modal-actions { display: flex; justify-content: center; gap: 10px; margin-top: 25px; }
    .modal-actions button { width: auto; min-width: 100px; margin: 0; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h2 style="margin:0;">圖文系設備預約系統</h2>
    <div id="userStatusDisplay" style="display:none; font-weight:600; color:var(--text-main);">
      <span id="welcomeText"></span>
      <a href="#" onclick="logout()" style="margin-left:15px; color:var(--danger); text-decoration:none;">登出</a>
    </div>
  </div>

  <div id="globalLoading">系統資料載入中，請稍候...</div>

  <div class="app-container" id="appContainer">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('dashboardTab', this)">設備行事曆</button>
      <button class="tab-btn" onclick="switchTab('profileTab', this)">我的預約</button>
      <button class="tab-btn" id="adminTabBtn" onclick="switchTab('adminTab', this)" style="display:none; color:var(--danger);">管理後台</button>
    </div>

    <div id="dashboardTab" class="tab-content active">
      <select id="viewEquipment" onchange="renderSchedule()"><option value="">-- 請選擇設備 --</option></select>
      <div style="text-align: right; margin: 15px 0;">
        <button onclick="changeWeek(-7)" style="background:var(--bg-gray); border:1px solid var(--border); color:var(--text-main);">上一週</button>
        <button onclick="changeWeek(0)" style="background:var(--bg-gray); border:1px solid var(--border); color:var(--text-main);">本週</button>
        <button onclick="changeWeek(7)" style="background:var(--bg-gray); border:1px solid var(--border); color:var(--text-main);">下一週</button>
      </div>
      <div class="table-container" id="scheduleContainer"></div>
      
      <!-- 行事曆底部標註 -->
      <div style="margin-top: 15px; font-size: 14px; color: var(--danger); font-weight: 600; text-align: right;">
        * 預約規定：每人每週最多僅能預約 2 個時段
      </div>
    </div>

    <div id="profileTab" class="tab-content">
      <div id="loginSection" style="max-width: 400px; margin: 0 auto;">
        <h3 style="text-align:center; margin-bottom:20px;">會員登入</h3>
        <input type="text" id="loginId" placeholder="輸入學號/帳號">
        <input type="password" id="loginPwd" placeholder="輸入密碼">
        <button id="loginBtn" class="btn-primary" onclick="login()">登入系統</button>
      </div>
      <div id="myBookingsSection" style="display:none;">
        <h3 style="margin-top:0;">我的紀錄與通行證</h3>
        <div id="myBookingsList"></div>
      </div>
    </div>

    <div id="adminTab" class="tab-content">
      <div class="admin-panel">
        <h3 style="margin-top:0;">待審核清單</h3>
        <table style="width:100%; text-align:left;">
          <thead><tr><th>日期/時段</th><th>設備</th><th>申請人</th><th style="text-align:center;">操作</th></tr></thead>
          <tbody id="pendingListBody"></tbody>
        </table>
      </div>
      
      <div class="admin-panel">
        <h3 style="margin-top:0;">學生權限管理</h3>
        <div style="display:flex; gap:10px; align-items:stretch;">
          <input type="text" id="searchAuthId" placeholder="輸入學號查詢" style="margin:0;">
          <button id="searchUserBtn" class="btn-primary" style="width:120px; margin:0; padding: 0 16px;" onclick="searchUserAuth()">查詢</button>
        </div>
        
        <div id="authManageArea" style="display:none; margin-top:25px; padding-top:25px; border-top:1px solid var(--border);">
          <p>姓名：<strong id="authManageName"></strong> (<span id="authManageLevel"></span>)</p>
          
          <p style="margin: 20px 0 10px 0; font-weight:600;">已認證機台設定：</p>
          <div id="eqCheckboxGroup" class="checkbox-group"></div>
          
          <div class="points-box">
            <p style="margin-top:0; font-weight:600;">違規點數與停權狀態 <span style="font-weight:normal; color:var(--text-muted);">(目前累積：<strong id="currentPointsDisplay" style="color:var(--danger); font-size:16px;">0</strong> 點)</span></p>
            <div class="points-row">
              <label for="pointChange" style="font-weight:600; white-space:nowrap;">本次增減：</label>
              <input type="number" id="pointChange" value="0" style="width:100px; margin:0;" title="正數加點，負數扣點">
              <span style="font-size:13px; color:var(--text-muted);">正數為加點，負數為扣除點數</span>
            </div>
            <input type="text" id="authSuspended" placeholder="請輸入記點原因，或填寫停權期限 (無事請留白)" style="margin-bottom:0;">
          </div>
          
          <button id="saveAuthBtn" class="btn-success" style="width:100%;" onclick="saveUserAuth()">儲存權限與點數</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="customModal">
    <div class="modal-box">
      <h3 id="modalTitle">提示</h3>
      <p id="modalBody" style="white-space: pre-line; color:var(--text-muted); margin-bottom: 25px;"></p>
      <div class="modal-actions">
        <button id="modalCancelBtn" style="display:none; background:var(--bg-gray); color:var(--text-main); border:1px solid var(--border);" onclick="closeModal()">取消</button>
        <button class="btn-primary" id="modalConfirmBtn" onclick="closeModal()">確認</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxIhLOx0YoosuM29-66vjQ6rXGznqo-_QrfWH5IW5omSTHwfH0UPxBX-m5ZkNpR80kHoA/exec'; // ⚠️ 請更新 URL
    
    let globalEquipments = [], globalTimeSlots = [], globalBookedRecords = [], globalUsers = {};
    let currentUser = null, currentDateOffset = 0, currentConfirmCallback = null;
    let targetUserPoints = 0; 

    const dayMap = {0: "星期日", 1: "星期一", 2: "星期二", 3: "星期三", 4: "星期四", 5: "星期五", 6: "星期六"};
    function getLocalDateString(dateObj) { return new Date(dateObj.getTime() - (dateObj.getTimezoneOffset() * 60000)).toISOString().split('T')[0]; }

    function showModal(title, body, isConfirm = false, onConfirm = null) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').textContent = body;
      document.getElementById('modalCancelBtn').style.display = isConfirm ? "block" : "none";
      currentConfirmCallback = onConfirm;
      document.getElementById('modalConfirmBtn').onclick = () => { closeModal(); if(currentConfirmCallback) currentConfirmCallback(); };
      document.getElementById('customModal').classList.add('active');
    }
    
    function closeModal() { document.getElementById('customModal').classList.remove('active'); }

    function setBtnLoading(btnId, isLoading, text = "處理中...") {
      const btn = document.getElementById(btnId);
      if(!btn) return;
      if (isLoading) {
        if (!btn.dataset.originalWidth) btn.dataset.originalWidth = btn.offsetWidth + 'px';
        btn.style.width = btn.dataset.originalWidth;
        btn.dataset.originalText = btn.textContent;
        btn.textContent = text;
        btn.disabled = true;
      } else {
        btn.textContent = btn.dataset.originalText || "確認";
        btn.style.width = ''; 
        btn.disabled = false;
      }
    }

    window.onload = () => { fetchData(); };

    function fetchData() {
      fetch(API_URL + '?action=getAllData').then(res => res.json()).then(data => {
        globalEquipments = data.equipments; globalTimeSlots = data.slots;
        globalBookedRecords = data.bookings; globalUsers = data.users;
        
        let optHTML = '<option value="">-- 請選擇設備 --</option>';
        globalEquipments.forEach(eq => {
          let isNormal = (!eq.status || String(eq.status).trim() === '正常' || String(eq.status).trim() === '可借用');
          if (isNormal) {
            optHTML += `<option value="${eq.displayText}">${eq.displayText}</option>`;
          } else {
            optHTML += `<option value="${eq.displayText}" disabled>${eq.displayText} (狀態：${eq.status})</option>`;
          }
        });
        document.getElementById("viewEquipment").innerHTML = optHTML;
        
        if(currentUser) {
            renderMyBookings();
            if(currentUser.level !== '一般同學') renderAdminPanel();
        }
        
        document.getElementById("globalLoading").style.display = "none";
        document.getElementById("appContainer").style.display = "block";
      }).catch(err => {
        document.getElementById("globalLoading").innerHTML = "資料載入失敗，請檢查 API 網址。";
      });
    }

    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if(btnElement) btnElement.classList.add('active');
      if(tabId === 'adminTab') renderAdminPanel();
    }

    function login() {
      const id = document.getElementById("loginId").value, pwd = document.getElementById("loginPwd").value;
      setBtnLoading("loginBtn", true, "登入中...");
      
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', id: id, password: pwd }) })
      .then(res => res.json()).then(data => {
        if (data.status === "success") {
          currentUser = data.user;
          document.getElementById("loginSection").style.display = "none";
          document.getElementById("myBookingsSection").style.display = "block";
          document.getElementById("userStatusDisplay").style.display = "flex";
          document.getElementById("welcomeText").textContent = `${currentUser.name} (${currentUser.level})`;
          
          if (currentUser.level !== '一般同學') document.getElementById("adminTabBtn").style.display = "inline-block";
          renderMyBookings();
        } else showModal("登入失敗", data.message);
      }).finally(() => setBtnLoading("loginBtn", false));
    }

    function logout() {
      currentUser = null;
      document.getElementById("loginSection").style.display = "block";
      document.getElementById("myBookingsSection").style.display = "none";
      document.getElementById("userStatusDisplay").style.display = "none";
      document.getElementById("adminTabBtn").style.display = "none";
      switchTab('dashboardTab', document.querySelector('.tab-btn'));
    }

    function changeWeek(days) { currentDateOffset = days === 0 ? 0 : currentDateOffset + days; renderSchedule(); }

    function renderSchedule() {
      const eq = document.getElementById("viewEquipment").value;
      const container = document.getElementById("scheduleContainer");
      if (!eq) return container.innerHTML = '';

      let baseDate = new Date();
      baseDate.setDate(baseDate.getDate() + currentDateOffset + (baseDate.getDay() === 0 ? -6 : 1 - baseDate.getDay()));
      const todayStr = getLocalDateString(new Date());
      let next7Days = [];
      for (let i = 0; i < 7; i++) {
        let d = new Date(baseDate); d.setDate(baseDate.getDate() + i);
        let dateStr = getLocalDateString(d);
        next7Days.push({ date: dateStr, display: `${d.getMonth()+1}/${d.getDate()}(${dayMap[d.getDay()]})`, dayOfWeek: dayMap[d.getDay()], isPast: dateStr < todayStr });
      }

      let uniqueTimes = [...new Set(globalTimeSlots.map(s => s.time))].sort((a, b) => {
          let hourA = parseInt(String(a).split(':')[0], 10) || 0;
          let hourB = parseInt(String(b).split(':')[0], 10) || 0;
          return hourA - hourB;
      });
      
      let html = `<table><thead><tr><th>時段</th>`;
      next7Days.forEach(d => html += `<th>${d.display}</th>`);
      html += `</tr></thead><tbody>`;

      uniqueTimes.forEach(t => {
        html += `<tr><td>${t}</td>`;
        next7Days.forEach(d => {
          let roomRule = globalTimeSlots.find(s => String(s.day).trim() === d.dayOfWeek && String(s.time).trim() === String(t).trim());
          
          if (!roomRule || String(roomRule.status).trim() !== "可借用" || d.isPast) {
            let reasonText = (roomRule && roomRule.note) ? roomRule.note : "不可用";
            html += `<td class="slot-closed">不開放<span class="slot-reason">${reasonText}</span></td>`;
          } else {
            let booking = globalBookedRecords.find(b => b.date === d.date && b.timeSlot === t && b.equipment === eq && b.status !== '已取消' && b.status !== '已拒絕');
            if (booking) {
              let name = globalUsers[booking.applicant] ? globalUsers[booking.applicant].name : '';
              html += `<td class="slot-booked">已預約<br><small style="color:#7f1d1d;">${booking.applicant} ${name}</small></td>`;
            } else {
              html += `<td class="slot-available" onclick="clickCell('${eq}','${d.date}','${t}')">可預約</td>`;
            }
          }
        });
        html += `</tr>`;
      });
      container.innerHTML = html + `</tbody></table>`;
    }

    function clickCell(eq, date, time) {
      if (!currentUser) {
        return showModal("提示", "請先登入以進行預約。", true, () => {
          switchTab('profileTab', document.querySelectorAll('.tab-btn')[1]);
          setTimeout(() => document.getElementById('loginId').focus(), 100);
        });
      }
      if (currentUser.level === '一般同學' && !currentUser.authEq.includes(eq)) {
        return showModal("權限不足", `您尚未通過【${eq}】認證，無法預約。`);
      }
      showModal("確認預約", `預約項目：${eq}\n日期：${date}\n時段：${time}`, true, () => {
        fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'reserve', applicant: currentUser.id, equipment: eq, date: date, timeSlot: time }) })
        .then(res => res.json()).then(data => {
          if (data.status === "success") {
            globalBookedRecords.push({ reserveId: data.reserveId, applicant: currentUser.id, equipment: eq, date: date, timeSlot: time, status: '待審核' });
            renderSchedule(); renderMyBookings(); showModal("完成", "預約已送出，請等待審核。");
          } else showModal("失敗", data.message);
        });
      });
    }

    function renderMyBookings() {
      const container = document.getElementById("myBookingsList");
      container.innerHTML = "";
      let myRecords = globalBookedRecords.filter(b => String(b.applicant) === String(currentUser.id) && b.status !== '已取消');
      myRecords.sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(rec => {
        let div = document.createElement("div");
        if(rec.status === '已核准' && rec.date >= getLocalDateString(new Date())) {
          div.className = "digital-pass";
          div.innerHTML = `<div><h4>數位通行證</h4><p style="margin:0;"><strong>${rec.equipment}</strong><br>${rec.date} ${rec.timeSlot}</p></div>`;
        } else {
          div.style = "border:1px solid var(--border); padding:15px; margin-bottom:15px; border-radius:2px; display:flex; justify-content:space-between; align-items:center;";
          let cancelBtn = (rec.date >= getLocalDateString(new Date()) && rec.status !== '已拒絕') ? `<button class="btn-danger" style="padding:6px 12px;" onclick="cancelBooking('${rec.reserveId}')">取消</button>` : "";
          div.innerHTML = `<div><strong style="font-size:15px;">${rec.equipment}</strong><br><span style="color:var(--text-muted); font-size:14px;">${rec.date} ${rec.timeSlot} - ${rec.status}</span></div>${cancelBtn}`;
        }
        container.appendChild(div);
      });
    }
    
    function cancelBooking(reserveId) {
      showModal("取消確認", "確定要撤銷此預約？", true, () => {
        let record = globalBookedRecords.find(b => b.reserveId === reserveId);
        if(record) record.status = '已取消';
        renderSchedule(); renderMyBookings();
        fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'cancel', applicant: currentUser.id, reserveId: reserveId }) });
      });
    }

    function renderAdminPanel() {
      const tbody = document.getElementById("pendingListBody");
      tbody.innerHTML = "";
      let pending = globalBookedRecords.filter(b => b.status === '待審核');
      pending.forEach(b => {
        let name = globalUsers[b.applicant] ? globalUsers[b.applicant].name : b.applicant;
        tbody.innerHTML += `<tr>
          <td>${b.date}<br><span style="color:var(--text-muted); font-size:12px;">${b.timeSlot}</span></td>
          <td>${b.equipment}</td>
          <td>${name}</td>
          <td style="text-align:center; display:flex; gap:5px; justify-content:center;">
            <button id="btn-apr-${b.reserveId}" class="btn-success" style="padding:6px 12px;" onclick="updateStatus('${b.reserveId}', '已核准', 'btn-apr-${b.reserveId}')">核准</button>
            <button id="btn-rej-${b.reserveId}" class="btn-danger" style="padding:6px 12px;" onclick="updateStatus('${b.reserveId}', '已拒絕', 'btn-rej-${b.reserveId}')">拒絕</button>
          </td>
        </tr>`;
      });
    }

    function updateStatus(reserveId, newStatus, btnId) {
      setBtnLoading(btnId, true, "中...");
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateStatus', reserveId: reserveId, newStatus: newStatus, approver: currentUser.name }) })
      .then(res => res.json()).then(data => {
         if(data.status === 'success'){
            let record = globalBookedRecords.find(b => b.reserveId === reserveId);
            if(record) record.status = newStatus;
            renderAdminPanel(); renderSchedule();
         }
      }).catch(() => showModal("錯誤", "處理失敗，請重新整理"));
    }

    function searchUserAuth() {
      targetUserId = document.getElementById("searchAuthId").value.trim();
      if(!targetUserId) return;
      
      setBtnLoading("searchUserBtn", true, "查詢中...");
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getUserAuth', searchId: targetUserId }) })
      .then(res => res.json()).then(data => {
        if(data.status === 'success') {
          document.getElementById("authManageArea").style.display = "block";
          document.getElementById("authManageName").textContent = data.name;
          document.getElementById("authManageLevel").textContent = data.level;
          
          targetUserPoints = data.points;
          document.getElementById("currentPointsDisplay").textContent = targetUserPoints;
          document.getElementById("pointChange").value = "0"; 
          document.getElementById("authSuspended").value = data.suspended;
          
          let cbHtml = "";
          globalEquipments.forEach(eq => {
            let checked = data.authEq.includes(eq.displayText) ? "checked" : "";
            let displayStatus = (!eq.status || String(eq.status).trim() === '正常' || String(eq.status).trim() === '可借用') ? '' : ` (${eq.status})`;
            cbHtml += `<label class="checkbox-label"><input type="checkbox" class="auth-cb" value="${eq.displayText}" ${checked}> ${eq.displayText}${displayStatus}</label>`;
          });
          document.getElementById("eqCheckboxGroup").innerHTML = cbHtml;
        } else showModal("查詢失敗", data.message);
      }).finally(() => setBtnLoading("searchUserBtn", false));
    }

    function saveUserAuth() {
      let selectedEq = Array.from(document.querySelectorAll('.auth-cb:checked')).map(cb => cb.value);
      let pointChange = parseInt(document.getElementById("pointChange").value) || 0;
      let newTotalPoints = targetUserPoints + pointChange;
      let suspended = document.getElementById("authSuspended").value;
      
      setBtnLoading("saveAuthBtn", true, "儲存中...");
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateUserAuth', targetId: targetUserId, authEq: selectedEq, points: newTotalPoints, suspended: suspended }) })
      .then(res => res.json()).then(data => {
        if(data.status === 'success') {
           targetUserPoints = newTotalPoints; 
           document.getElementById("currentPointsDisplay").textContent = targetUserPoints;
           document.getElementById("pointChange").value = "0"; 
           showModal("更新完成", "權限與點數紀錄已儲存。");
        } else showModal("失敗", data.message);
      }).finally(() => setBtnLoading("saveAuthBtn", false));
    }
  </script>
</body>
</html>
