<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>實驗室設備預約系統</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    select, input { padding: 8px; width: 100%; max-width: 300px; box-sizing: border-box; }
    button { padding: 10px 20px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>實驗室設備預約</h2>

  <form id="reserveForm">
    <div class="form-group">
      <label for="applicant">申請人姓名：</label>
      <input type="text" id="applicant" required placeholder="請輸入姓名">
    </div>

    <div class="form-group">
      <label for="equipment">預約設備：</label>
      <select id="equipment" required>
        <option value="">資料載入中...</option>
      </select>
    </div>

    <div class="form-group">
      <label for="reserveDate">預約日期：</label>
      <input type="date" id="reserveDate" required>
    </div>

    <div class="form-group">
      <label for="timeSlot">預約時段：</label>
      <select id="timeSlot" required>
        <option value="">請先選擇日期</option>
      </select>
    </div>

    <button type="submit" id="submitBtn">送出預約</button>
  </form>

  <script>
    // 確認此網址與你最新部署的 GAS Web App 網址一致
    const API_URL = 'https://script.google.com/macros/s/AKfycbxbZ6zmaG-zlsx24YAH-TTIqaaicBNtUjH8b7BUHvC7qSmTCMyjSeA7HP7NvCN7H_5XVQ/exec';
    
    let timeSlotData = [];
    const dayMap = {0: "星期日", 1: "星期一", 2: "星期二", 3: "星期三", 4: "星期四", 5: "星期五", 6: "星期六"};

    window.onload = function() {
      // 限制只能選擇今天（含）以後的日期
      const today = new Date().toISOString().split('T')[0];
      document.getElementById("reserveDate").setAttribute('min', today);

      // 載入設備清單
      fetch(API_URL + '?action=getEquipment')
        .then(response => response.json())
        .then(data => {
          const eqSelect = document.getElementById("equipment");
          eqSelect.innerHTML = '<option value="">請選擇設備</option>';
          data.forEach(item => {
            const option = document.createElement("option");
            option.value = item.displayText;
            option.textContent = item.displayText;
            eqSelect.appendChild(option);
          });
        })
        .catch(error => console.error("設備載入錯誤：", error));

      // 載入時段資料
      fetch(API_URL + '?action=getTimeSlots')
        .then(response => response.json())
        .then(data => {
          timeSlotData = data;
        })
        .catch(error => console.error("時段載入錯誤：", error));
    };

    // 監聽日期變更事件
    document.getElementById("reserveDate").addEventListener("change", function(event) {
      const selectedDate = new Date(event.target.value);
      const dayString = dayMap[selectedDate.getDay()]; 
      const timeSelect = document.getElementById("timeSlot");
      
      timeSelect.innerHTML = '<option value="">請選擇時段...</option>';

      if (timeSlotData.length === 0) return;

      const availableSlots = timeSlotData.filter(slot => slot.day === dayString && slot.status === "可借用");

      if (availableSlots.length === 0) {
        timeSelect.innerHTML = '<option value="">當日無可借用時段</option>';
      } else {
        availableSlots.forEach(slot => {
          const option = document.createElement("option");
          option.value = slot.time;
          option.textContent = slot.time;
          timeSelect.appendChild(option);
        });
      }
    });

    // 處理表單送出
    document.getElementById("reserveForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "資料處理中...";

      const requestData = {
        applicant: document.getElementById("applicant").value,
        equipment: document.getElementById("equipment").value,
        date: document.getElementById("reserveDate").value,
        timeSlot: document.getElementById("timeSlot").value
      };

      fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8' // 避免 CORS 預檢請求
        },
        body: JSON.stringify(requestData)
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "success") {
          alert("預約成功！資料已送出。");
          document.getElementById("reserveForm").reset();
        } else {
          alert("預約失敗，錯誤訊息：" + data.message);
        }
      })
      .catch(error => {
        alert("網路連線發生錯誤，請稍後再試。");
        console.error(error);
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = "送出預約";
      });
    });
  </script>
</body>
</html>
