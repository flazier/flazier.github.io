<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>實驗室預約系統測試</title>
</head>

  
<body>
  <h2>實驗室設備預約</h2>
  
  <form id="reservationForm">
    <!-- 申請人 (暫代登入資訊) -->
    <div>
      <label for="applicant">申請人 (學號/姓名)：</label>
      <input type="text" id="applicant" required>
    </div>
    <br>

    <!-- 設備與教室選單 -->
    <div>
      <label for="equipment">選擇設備與教室：</label>
      <select id="equipment" required>
        <option value="">載入資料中...</option>
      </select>
    </div>
    <br>

    <!-- 日期與時段 -->
    <div>
      <label for="reserveDate">預約日期：</label>
      <input type="date" id="reserveDate" required>
    </div>
    <br>
    <div>
      <label for="timeSlot">預約時段：</label>
      <select id="timeSlot" required>
        <option value="">請選擇時段...</option>
        <option value="08:00-12:00">上午 (08:00 - 12:00)</option>
        <option value="13:00-17:00">下午 (13:00 - 17:00)</option>
        <option value="18:00-22:00">晚上 (18:00 - 22:00)</option>
      </select>
    </div>
    <br>

    <!-- 送出按鈕 -->
    <button type="submit">送出預約</button>
  </form>

  <script>
    const apiUrl = "https://script.google.com/macros/s/AKfycbzUAe3-gkmtSiZ_YPPHbnLWhBF7jDNl8b5IhxOMRqRBti34hZqE8O7PUGK5ScfDVpD0fQ/exec";
    const select = document.getElementById("equipment");

    // 負責將資料繪製到選單的函式
    function renderEquipment(data) {
      select.innerHTML = '<option value="">請選擇...</option>';
      data.forEach(item => {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = item.displayText;
        select.appendChild(option);
      });
    }

    // 1. 優先檢查本機快取，若有資料則瞬間載入
    const cachedData = localStorage.getItem("gcaEquipmentList");
    if (cachedData) {
      renderEquipment(JSON.parse(cachedData));
    }

    // 2. 在背景向 GAS 請求最新資料，並更新快取
    fetch(apiUrl + "?action=getEquipment", {
      method: 'GET',
      redirect: 'follow'
    })
      .then(response => response.json())
      .then(data => {
        // 將最新資料存入快取
        localStorage.setItem("gcaEquipmentList", JSON.stringify(data));
        // 更新選單畫面
        renderEquipment(data);
      })
      .catch(error => {
        console.error("API 讀取失敗：", error);
        if (!cachedData) {
          select.innerHTML = '<option value="">讀取失敗，請重試</option>';
        }
      });

    // 3. 監聽表單送出事件
    document.getElementById("reservationForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const requestData = {
        applicant: document.getElementById("applicant").value,
        equipmentId: document.getElementById("equipment").value,
        date: document.getElementById("reserveDate").value,
        timeSlot: document.getElementById("timeSlot").value
      };

      console.log("準備送出的預約資料：", requestData);
      alert("資料已收集，請按 F12 查看 Console 確認格式。");
    });
  </script>
</body>
</html>
