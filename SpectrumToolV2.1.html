<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>畫頻譜圖、抓Lab</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-body: #f4f6f8; --bg-card: #ffffff; --text-main: #2c3e50; --border: #dcdfe6; }
        [data-theme="dark"] { --bg-body: #121212; --bg-card: #1e1e1e; --text-main: #e0e0e0; --border: #3d3d3d; }
        body { font-family: "Inter", "Segoe UI", sans-serif; margin: 0; padding: 20px; background: var(--bg-body); color: var(--text-main); transition: 0.3s; }
        .wrapper { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--bg-card); padding: 18px; border-radius: 10px; border: 1px solid var(--border); box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .top-row { display: grid; grid-template-columns: 420px 1fr; gap: 15px; }
        
        .input-unit { margin-bottom: 10px; }
        .name-input { width: 100%; padding: 5px 8px; margin-bottom: 4px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-body); color: var(--text-main); font-weight: bold; font-size: 12px; }
        textarea { width: 100%; height: 50px; font-family: "Consolas", monospace; padding: 8px; box-sizing: border-box; background: rgba(128,128,128,0.05); color: var(--text-main); border: 1px solid var(--border); border-radius: 6px; font-size: 11px; resize: none; }
        
        .swatch-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .swatch-card { background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
        .swatch-header { padding: 6px 10px; font-weight: bold; font-size: 13px; background: rgba(128,128,128,0.1); border-bottom: 1px solid var(--border); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .swatch-box { width: 100%; height: 100px; border-bottom: 1px solid var(--border); } 
        .swatch-info { padding: 12px; flex-grow: 1; min-height: 100px; background: var(--bg-card); }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-family: "Consolas", monospace; font-size: 12px; }
        
        .config-bar { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; padding: 10px; background: rgba(128,128,128,0.03); border-radius: 6px; margin-top: 10px; font-size: 12px; }
        .chart-main { display: flex; flex-direction: column; align-items: center; }
        .canvas-container { width: 100%; height: 250px; position: relative; border: 1px solid var(--border); background: #fff; border-radius: 4px; }
        
        .de-table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 13px; text-align: center; }
        .de-table th { background: rgba(128,128,128,0.08); padding: 8px; border: 1px solid var(--border); }
        .de-table td { padding: 8px; border: 1px solid var(--border); font-family: "Consolas", monospace; }
        
        button { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: 600; font-size: 12px; }
        .btn-theme { background: #5a6268; color: white; float: right; }
        .btn-swatch-dl { background: #eee; color: #333; font-size: 10px; border-top: 1px solid var(--border); border-radius: 0; padding: 8px; }
        [data-theme="dark"] .btn-swatch-dl { background: #333; color: #ccc; }
    </style>
</head>
<body data-theme="light">

<div class="wrapper">
    <div class="top-row">
        <div class="card">
            <button class="btn-theme" onclick="toggleTheme()">🌓 模式切換</button>
            <h3 style="margin:0 0 10px 0; font-size:16px;">1. 資料輸入</h3>
            
            <div class="input-unit">
                <input type="text" id="name0" class="name-input" value="樣本 A" oninput="processAll()">
                <textarea id="data0" onclick="this.select()" oninput="processAll()"></textarea>
            </div>
            <div class="input-unit">
                <input type="text" id="name1" class="name-input" value="樣本 B" oninput="processAll()">
                <textarea id="data1" onclick="this.select()" oninput="processAll()"></textarea>
            </div>
            <div class="input-unit">
                <input type="text" id="name2" class="name-input" value="樣本 C" oninput="processAll()">
                <textarea id="data2" onclick="this.select()" oninput="processAll()"></textarea>
            </div>
            
            <div style="display:flex; gap:12px; font-size:12px; padding-top:8px;">
                <label><input type="checkbox" id="chkLab" checked onchange="processAll()"> Lab</label>
                <label><input type="checkbox" id="chkLCh" onchange="processAll()"> LCh</label>
                <label><input type="checkbox" id="chkXYZ" onchange="processAll()"> XYZ</label>
                <label><input type="checkbox" id="chkxyY" onchange="processAll()"> xyY</label>
            </div>
        </div>

        <div class="card">
            <h3 style="margin:0 0 10px 0; font-size:16px;">2. 色票預覽</h3>
            <div class="swatch-container">
                <div class="swatch-card" id="card0">
                    <div class="swatch-header" id="header0">樣本 A</div>
                    <div id="box0" class="swatch-box"></div>
                    <div class="swatch-info" id="info0"></div>
                    <button class="btn-swatch-dl" onclick="exportSwatch(0)">下載( JPG )</button>
                </div>
                <div class="swatch-card" id="card1">
                    <div class="swatch-header" id="header1">樣本 B</div>
                    <div id="box1" class="swatch-box"></div>
                    <div class="swatch-info" id="info1"></div>
                    <button class="btn-swatch-dl" onclick="exportSwatch(1)">下載( JPG )</button>
                </div>
                <div class="swatch-card" id="card2">
                    <div class="swatch-header" id="header2">樣本 C</div>
                    <div id="box2" class="swatch-box"></div>
                    <div class="swatch-info" id="info2"></div>
                    <button class="btn-swatch-dl" onclick="exportSwatch(2)">下載( JPG )</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card chart-main">
        <div id="resizeBox" class="canvas-container">
            <canvas id="specChart"></canvas>
        </div>

        <div class="config-bar">
            <div class="color-pickers">
                色1:<input type="color" id="c0" value="#ff3b30" oninput="processAll()">
                色2:<input type="color" id="c1" value="#34c759" oninput="processAll()">
                色3:<input type="color" id="c2" value="#007aff" oninput="processAll()">
                | 背景:<input type="color" id="bgColor" value="#ffffff" oninput="processAll()">
                <label><input type="checkbox" id="transCheck" onchange="processAll()"> 透明</label>
            </div>
            <div style="margin-left:auto; display:flex; gap:8px;">
                圖片檔名: <input type="text" id="fileName" value="Spectrum" style="width:120px; padding:4px;">
                <button style="background:#007aff; color:white;" onclick="downloadChart('png')">PNG</button>
                <button style="background:#28a745; color:white;" onclick="downloadChart('jpg')">JPG</button>
            </div>
        </div>

        <div style="width:100%; max-width:800px; margin-top:10px;">
            <div style="display:flex; align-items:center; gap:15px; font-size:11px;">寬度:<input type="range" id="wSlide" min="400" max="1200" value="950" style="flex:1" oninput="resizePlot()"></div>
            <div style="display:flex; align-items:center; gap:15px; font-size:11px; margin-top:5px;">高度:<input type="range" id="hSlide" min="150" max="500" value="250" style="flex:1" oninput="resizePlot()"></div>
        </div>
    </div>

    <div class="card">
        <h3 style="margin:0 0 10px 0; font-size:16px;">4. 色差分析</h3>
        <table class="de-table">
            <thead>
                <tr><th>組合</th><th>ΔEab (1976)</th><th>ΔE00 (2000)</th></tr>
            </thead>
            <tbody id="deBody"></tbody>
        </table>
    </div>
</div>

<script>
    let myChart;
    const waves = Array.from({length: 36}, (_, i) => 380 + i * 10);
    let parsedData = [null, null, null];

    function toggleTheme() {
        const b = document.body;
        b.setAttribute('data-theme', b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        processAll();
    }

    function initChart() {
        const ctx = document.getElementById('specChart').getContext('2d');
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: waves,
                datasets: [
                    { label: '', data: [], borderColor: '#ff3b30', borderWidth: 1.5, pointRadius: 0, tension: 0.1 },
                    { label: '', data: [], borderColor: '#34c759', borderWidth: 1.5, pointRadius: 0, tension: 0.1 },
                    { label: '', data: [], borderColor: '#007aff', borderWidth: 1.5, pointRadius: 0, tension: 0.1 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: { ticks: { color: () => getThemeCol('text'), font: {size:10} }, grid: { color: () => getThemeCol('grid') } },
                    y: { min: 0, max: 1.0, ticks: { stepSize: 0.2, color: () => getThemeCol('text') }, grid: { color: () => getThemeCol('grid') } }
                },
                plugins: { legend: { labels: { color: () => getThemeCol('text') } } }
            },
            plugins: [{
                id: 'customBg',
                beforeDraw: (c) => {
                    const ctx = c.ctx;
                    ctx.save(); ctx.globalCompositeOperation = 'destination-over';
                    ctx.fillStyle = document.getElementById('transCheck').checked ? 'transparent' : document.getElementById('bgColor').value;
                    ctx.fillRect(0, 0, c.width, c.height); ctx.restore();
                }
            }]
        });
    }

    function getThemeCol(t) {
        const dark = document.body.getAttribute('data-theme') === 'dark';
        return t === 'text' ? (dark ? '#bbb' : '#444') : (dark ? '#333' : '#eee');
    }

    function processAll() {
        if (!myChart) return;
        [0, 1, 2].forEach(i => {
            const name = document.getElementById('name' + i).value;
            const val = document.getElementById('data' + i).value.trim();
            
            document.getElementById('header' + i).innerText = name;
            myChart.data.datasets[i].label = name;

            if (!val) return;
            const arr = val.split(/\s+/).map(Number).filter(n => !isNaN(n));
            if (arr.length < 9) return;

            const lab = { L: arr[6], a: arr[7], b: arr[8] };
            const xyz = { X: arr[0], Y: arr[1], Z: arr[2] };
            const xyy = { x: arr[3], y: arr[4], Y: arr[5] };
            parsedData[i] = { name, lab, xyz, xyy };

            document.getElementById('box' + i).style.backgroundColor = labToRgb(lab.L, lab.a, lab.b);
            
            let h = "";
            if(document.getElementById('chkLab').checked) {
                h += `<div class="data-row"><span>L</span><span>${lab.L.toFixed(2)}</span></div>`;
                h += `<div class="data-row"><span>a</span><span>${lab.a.toFixed(2)}</span></div>`;
                h += `<div class="data-row"><span>b</span><span>${lab.b.toFixed(2)}</span></div>`;
            }
            if(document.getElementById('chkLCh').checked) {
                const C = Math.sqrt(lab.a**2 + lab.b**2);
                let hue = Math.atan2(lab.b, lab.a) * 180 / Math.PI;
                if(hue<0) hue+=360;
                h += `<div class="data-row"><span>C / h°</span><span>${C.toFixed(2)} / ${hue.toFixed(1)}°</span></div>`;
            }
            if(document.getElementById('chkXYZ').checked) h += `<div style="font-size:10px; color:#999; margin-top:5px;">XYZ: ${xyz.X.toFixed(1)}, ${xyz.Y.toFixed(1)}, ${xyz.Z.toFixed(1)}</div>`;
            if(document.getElementById('chkxyY').checked) h += `<div style="font-size:10px; color:#999;">xyY: ${xyy.x.toFixed(3)}, ${xyy.y.toFixed(3)}, ${xyy.Y.toFixed(1)}</div>`;
            document.getElementById('info' + i).innerHTML = h;

            const spec = arr.slice(-36);
            if(spec.length === 36) myChart.data.datasets[i].data = spec;
            myChart.data.datasets[i].borderColor = document.getElementById('c' + i).value;
        });
        myChart.update('none');
        calculateDE();
    }

    function deltaE2000(lab1, lab2) {
        const d2r = d => d * Math.PI / 180, r2d = r => r * 180 / Math.PI;
        let L1 = lab1.L, a1 = lab1.a, b1 = lab1.b, L2 = lab2.L, a2 = lab2.a, b2 = lab2.b;
        let avgL = (L1 + L2) / 2, C1 = Math.sqrt(a1**2 + b1**2), C2 = Math.sqrt(a2**2 + b2**2), avgC = (C1 + C2) / 2;
        let G = 0.5 * (1 - Math.sqrt(Math.pow(avgC, 7) / (Math.pow(avgC, 7) + Math.pow(25, 7)))), a1p = (1 + G) * a1, a2p = (1 + G) * a2;
        let C1p = Math.sqrt(a1p**2 + b1**2), C2p = Math.sqrt(a2p**2 + b2**2), avgCp = (C1p + C2p) / 2;
        let h1p = r2d(Math.atan2(b1, a1p)); if(h1p < 0) h1p += 360;
        let h2p = r2d(Math.atan2(b2, a2p)); if(h2p < 0) h2p += 360;
        let avgHp = Math.abs(h1p - h2p) > 180 ? (h1p + h2p + 360) / 2 : (h1p + h2p) / 2;
        let T = 1 - 0.17 * Math.cos(d2r(avgHp - 30)) + 0.24 * Math.cos(d2r(2 * avgHp)) + 0.32 * Math.cos(d2r(3 * avgHp + 6)) - 0.2 * Math.cos(d2r(4 * avgHp - 63));
        let dHp = h2p - h1p; if(Math.abs(dHp) > 180) dHp = h2p <= h1p ? dHp + 360 : dHp - 360;
        let dL = L2 - L1, dCp = C2p - C1p, dH = 2 * Math.sqrt(C1p * C2p) * Math.sin(d2r(dHp) / 2);
        let SL = 1 + (0.015 * Math.pow(avgL - 50, 2)) / Math.sqrt(20 + Math.pow(avgL - 50, 2)), SC = 1 + 0.045 * avgCp, SH = 1 + 0.015 * avgCp * T;
        let dTheta = 30 * Math.exp(-Math.pow((avgHp - 275) / 25, 2)), RC = 2 * Math.sqrt(Math.pow(avgCp, 7) / (Math.pow(avgCp, 7) + Math.pow(25, 7))), RT = -RC * Math.sin(d2r(2 * dTheta));
        return Math.sqrt(Math.pow(dL/SL, 2) + Math.pow(dCp/SC, 2) + Math.pow(dH/SH, 2) + RT * (dCp/SC) * (dH/SH));
    }

    function calculateDE() {
        const pairs = [[0, 1], [1, 2], [0, 2]];
        const b = document.getElementById('deBody'); b.innerHTML = "";
        pairs.forEach(([i1, i2]) => {
            const d1 = parsedData[i1], d2 = parsedData[i2];
            if (!d1 || !d2) return;
            const de76 = Math.sqrt(Math.pow(d1.lab.L-d2.lab.L,2) + Math.pow(d1.lab.a-d2.lab.a,2) + Math.pow(d1.lab.b-d2.lab.b,2));
            const de00 = deltaE2000(d1.lab, d2.lab);
            b.innerHTML += `<tr><td>${d1.name} vs ${d2.name}</td><td>${de76.toFixed(2)}</td><td>${de00.toFixed(2)}</td></tr>`;
        });
    }

    function labToRgb(L, a, b) {
        let y = (L + 16) / 116, x = a / 500 + y, z = y - b / 200;
        [x, y, z] = [x, y, z].map(v => v**3 > 0.008856 ? v**3 : (v - 16/116) / 7.787);
        x *= 95.047; y *= 100.0; z *= 108.883;
        let r = x * 3.2406 + y * -1.5372 + z * -0.4986, g = x * -0.9689 + y * 1.8758 + z * 0.0415, b_ = x * 0.0557 + y * -0.2040 + z * 1.0570;
        [r, g, b_] = [r, g, b_].map(v => (v/100 <= 0.0031308 ? 12.92 * (v/100) : 1.055 * (Math.pow(v/100, 1/2.4)) - 0.055) * 255);
        return `rgb(${Math.max(0,Math.min(255,r))},${Math.max(0,Math.min(255,g))},${Math.max(0,Math.min(255,b_))})`;
    }

    function resizePlot() {
        const box = document.getElementById('resizeBox');
        box.style.width = document.getElementById('wSlide').value + 'px';
        box.style.height = document.getElementById('hSlide').value + 'px';
        if(myChart) myChart.resize();
    }

    function exportSwatch(i) {
        const data = parsedData[i]; if(!data) return;
        const canvas = document.createElement('canvas');
        canvas.width = 400; canvas.height = 420;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,400,420);
        ctx.fillStyle = labToRgb(data.lab.L, data.lab.a, data.lab.b);
        ctx.beginPath(); ctx.roundRect(30, 60, 340, 200, 15); ctx.fill();
        ctx.fillStyle = "#2c3e50"; ctx.font = "bold 24px Arial"; ctx.fillText(data.name, 30, 40);
        ctx.font = "18px Consolas";
        let y = 300;
        if(document.getElementById('chkLab').checked) {
            ctx.fillText(`L: ${data.lab.L.toFixed(2)}`, 40, y); y+=30;
            ctx.fillText(`a: ${data.lab.a.toFixed(2)}`, 40, y); y+=30;
            ctx.fillText(`b: ${data.lab.b.toFixed(2)}`, 40, y); y+=30;
        }
        if(document.getElementById('chkLCh').checked) {
            const C = Math.sqrt(data.lab.a**2 + data.lab.b**2);
            let hue = Math.atan2(data.lab.b, data.lab.a)*180/Math.PI; if(hue<0) hue+=360;
            ctx.fillText(`C/h: ${C.toFixed(2)} / ${hue.toFixed(1)}°`, 40, y); y+=30;
        }
        const link = document.createElement('a');
        link.download = `${data.name}.jpg`;
        link.href = canvas.toDataURL("image/jpeg", 0.95); link.click();
    }

    function downloadChart(fmt) {
        const c = document.getElementById('specChart');
        const base = document.getElementById('fileName').value;
        const link = document.createElement('a');
        link.download = `${base}_頻譜圖.${fmt}`;
        link.href = c.toDataURL(fmt==='jpg'?'image/jpeg':'image/png'); link.click();
    }

    window.onload = () => {
        initChart(); resizePlot();
        const ex = "19.3 20.2 23.5 0.31 0.33 20.2 52.1 12.5 -5.8 0 0 0.1 0.15 0.25 0.4 0.6 0.75 0.85 0.9 0.92 0.93 0.92 0.9 0.85 0.78 0.7 0.6 0.5 0.4 0.3 0.25 0.2 0.18 0.16 0.14 0.12 0.1 0.08 0.07 0.06 0.05 0.04 0.03 0.02 0.02 0.02";
        document.getElementById('data0').value = ex;
        document.getElementById('data1').value = ex;
        document.getElementById('data2').value = ex;
        setTimeout(processAll, 100);
    };
</script>
</body>
</html>
